[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sigill-sdk"
version = "0.1.1"
description = "AI evidence envelopes (AiEvidenceEnvelopeV1) — canonicalize, seal with RFC 3161 timestamps via Sigill, and verify."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Sigill" }]
keywords = [
    "ai",
    "evidence",
    "audit",
    "rfc3161",
    "rfc8785",
    "jcs",
    "canonicalization",
    "timestamping",
    "trust",
    "compliance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "jcs>=0.2.1",
    "asn1crypto>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "cryptography>=42.0",  # only used by tests/_tsr_factory.py for offline TSR fixtures
]

[project.urls]
Homepage = "https://github.com/sigill-ai/sigill-python"
Documentation = "https://github.com/sigill-ai/sigill-python/blob/main/spec/README.md"
Repository = "https://github.com/sigill-ai/sigill-python"
Issues = "https://github.com/sigill-ai/sigill-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sigill_sdk"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Both src/ and tests/ on sys.path: src/ for `import sigill_sdk`, tests/ so test
# helpers (like _tsr_factory) are importable as flat modules from any test file.
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN001", "ANN201", "ANN204"]
ignore = ["E501"]  # line length is enforced by formatter
