name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # for the GitHub Release
  id-token: write   # for PyPI trusted publishing (OIDC)

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Sanity check: the tag must match the version in pyproject.toml. Catches the
      # easy mistake of bumping the tag without bumping the package version (or vice
      # versa), which leads to a confusing PyPI rejection.
      - name: Verify tag matches pyproject.toml version
        run: |
          set -euo pipefail
          file_ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag_ver="${{ steps.ver.outputs.version }}"
          if [ "$file_ver" != "$tag_ver" ]; then
            echo "::error::Tag $tag_ver does not match pyproject.toml version $file_ver"
            exit 1
          fi

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build

      - name: Build sdist + wheel
        run: python -m build

      - name: Upload distributions as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-before-publish:
    name: Run test suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          pip install -e ".[dev]"
          pytest -q

  # Every release is sealed by Sigill before it is published: a detached CAdES
  # seal (.p7s) with an RFC 3161 timestamp and a post-quantum hybrid signature,
  # over the exact wheel and sdist that go to PyPI. Only digests leave the
  # runner. No seal, no release. Verify a download at https://sigill.ai/verify
  # with the .p7s from the GitHub release.
  seal:
    name: Seal with Sigill
    needs: [build, test-before-publish]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub OIDC token, exchanged for a short-lived Sigill token
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: sigill-ai/evidence-action@be2e7dafdd3c86ca5689995917b5e98f8c882a01 # v1.0.1
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          mode: seal
          pqc: true
      - uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: dist/*.p7s
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build, test-before-publish, seal]
    runs-on: ubuntu-latest
    environment: pypi   # MUST match the trusted-publisher entry on PyPI
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Kept out of dist/: the PyPI upload accepts distributions only.
      - uses: actions/download-artifact@v4
        with:
          name: evidence
          path: evidence/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password / token: PyPI trusted publishing uses OIDC tied to this
        # repo+workflow+environment combination, registered at
        # https://pypi.org/manage/account/publishing/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            evidence/*.p7s
          generate_release_notes: true
