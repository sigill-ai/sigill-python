name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not ubuntu-latest: the newer runner image has no Python 3.9 build.
        os: [ubuntu-24.04, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  spec-vectors:
    # Sanity check: regenerating the vendored spec test vectors must produce the
    # same bytes that are committed. If a contributor accidentally bumps something
    # canonical (or copies a divergent spec/ from sigill-dotnet), this catches it.
    name: Spec vectors are stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jcs and jsonschema references
        # jcs is pinned: the vectors were generated with 0.2.1, and 0.3.0 refuses the integer beyond 2^53 that
        # agent-run scenario 20 puts in an envelope on purpose (the verifier must report it, not the generator).
        run: pip install "jcs==0.2.1" jsonschema
      - name: Verify committed canonical bytes match regeneration
        run: |
          set -euo pipefail
          for vec in spec/test-vectors/01-complete-ai-call spec/test-vectors/02-pii-redacted spec/test-vectors/10-agent-controlled-run spec/test-vectors/agent-run spec/test-vectors/agent-run-tree; do
            python "$vec/_generate.py"
          done
          python spec/test-vectors/10-agent-controlled-run/_validate.py
          # status, not diff: also catches vectors the generator adds or no longer produces.
          if [ -n "$(git status --porcelain -- spec/test-vectors)" ]; then
            echo "::error::Test vectors drifted from committed values:"
            git status --porcelain -- spec/test-vectors
            git diff -- spec/test-vectors
            exit 1
          fi
      - name: Check vectors 11-14 (digests and schemas; their generators need Node and Cedar)
        run: |
          python - <<'EOF'
          import glob, hashlib, json, jcs, jsonschema
          load = lambda p: json.load(open(p, encoding="utf-8"))
          sha = lambda b: hashlib.sha256(b).hexdigest()
          scope = lambda d: sha(jcs.canonicalize({k: v for k, v in d.items() if k not in ("id", "version")}))
          for vec, schema in (("11-policy-control-set", "v1"), ("13-policy-control-set-v2", "v2")):
              raw = open(f"spec/test-vectors/{vec}/control-set.json", "rb").read()
              doc, want = json.loads(raw), load(f"spec/test-vectors/{vec}/expected.json")
              assert sha(raw) == want["objectSha256"], vec
              assert sha(jcs.canonicalize(doc["cedar"])) == want["cedarDigest"], vec
              assert scope(doc) == want["approvalScopeDigest"], vec
              assert sha(jcs.canonicalize(load(f"spec/agent-policy-cedar-schema-{schema}.json"))) == want["schemaSha256"], vec
          v14 = "spec/test-vectors/14-policy-enforcement"
          validators = {v: jsonschema.Draft202012Validator(load(f"spec/agent-execution-evidence-v{v}.schema.json")) for v in "1234"}
          ok = lambda e: validators[e["schemaVersion"]].is_valid(e)
          cases = load(f"{v14}/envelopes.json")
          assert all(ok(c["envelope"]) for c in cases["valid"]), [c["name"] for c in cases["valid"] if not ok(c["envelope"])]
          assert not any(ok(c["envelope"]) for c in cases["invalid"]), [c["name"] for c in cases["invalid"] if ok(c["envelope"])]
          base = load("spec/test-vectors/13-policy-control-set-v2/control-set.json")
          for path in sorted(glob.glob(f"{v14}/runs/*.json") + glob.glob(f"{v14}/findings/*.json")):
              run = load(path)
              assert all(ok(e["envelope"]) for e in run["events"]), path
              if "/runs/" in path:
                  expected = load(path.replace("/runs/", "/expected/"))
                  assert scope({**base, "enforcement": run["enforcement"]}) == expected["approvalScopeDigest"], path
          print("vectors 11-14: digests and schemas hold")
          EOF
